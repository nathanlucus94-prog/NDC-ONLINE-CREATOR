        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin-top: 0;
            color: #0056b3;
        }
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], select {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        .full-width {
            grid-column: span 2;
        }
        .preview-box {
            background-color: #272822;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            min-height: 150px;
            margin-bottom: 15px;
        }
        .btn-publish {
            background-color: #28a745;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .btn-publish:hover {
            background-color: #218838;

        </div>

        <div class="form-group">
            <label for="expires">Expires:</label>
            <select id="expires"></select>
        </div>

        <div class="form-group">
            <label for="extra">Extra:</label>
            <select id="extra"></select>
        </div>

        <div class="form-group">
            <label for="area">Area:</label>
            <input type="text" id="area" placeholder="Enter area...">
        </div>

        <div class="form-group full-width">
            <label for="extraVar">Extra Variable:</label>
            <input type="text" id="extraVar" placeholder="Enter extra variable value...">
        </div>
    </div>

    <div class="form-group">
        <label>Generated Alert Preview:</label>
        <div id="previewText" class="preview-box"></div>

    <button class="btn-publish" onclick="publishAlert()">Publish to Discord</button>
</div>

    for (const [key, options] of Object.entries(alert_variants)) {
        const selectElement = document.getElementById(key);
        if (selectElement) {
            options.forEach(option => {
                const opt = document.createElement('option');
                opt.value = option;
                opt.textContent = option;
                selectElement.appendChild(opt);
            });
            selectElement.addEventListener('change', updatePreview);
        }
    }

    document.getElementById('area').addEventListener('input', updatePreview);
    document.getElementById('extraVar').addEventListener('input', updatePreview);

    function updatePreview() {
        let extraText = document.getElementById('extra').value;
        const extraVarValue = document.getElementById('extraVar').value;

        if (extraText.includes("{ex_var}")) {
            extraText = extraText.replaceAll("{ex_var}", extraVarValue);
        }

        let alertText = "[ALERT]\n";
        alertText += `Title: ${document.getElementById('title').value}\n`;
        alertText += `Severity: ${document.getElementById('severity').value}\n`;
        alertText += `Summary: ${document.getElementById('summary').value}\n`;
        alertText += `Hazard: ${document.getElementById('hazard').value}\n`;
        alertText += `Area: ${document.getElementById('area').value}\n`;
        alertText += `Direction: ${document.getElementById('direction').value}\n`;
        alertText += `Expires: ${document.getElementById('expires').value}\n`;
        alertText += `Extra: ${extraText}\n`;

        document.getElementById('previewText').textContent = alertText;
    }

    async function publishAlert() {
        const alertText = document.getElementById('previewText').textContent.trim();

        if (!WEBHOOK_URL || WEBHOOK_URL.includes("PASTE_YOUR")) {
            alert("Error: Please set your Discord Webhook URL.");
            return;
        }

        const payload = { content: alertText };

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.status === 204) {
                alert("Success: Alert Published to Discord!");
            } else {
                alert(`Error: Failed to send alert.\nStatus Code: ${response.status}`);
            }
        } catch (error) {
            alert(`Error: ${error.message}`);
        }
    }

    updatePreview();
